
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Boo</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
    }

    .box {
      width: 200px;
      height: 200px;
      background-color: #ffcad4;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      font-size: 1.5em;
      font-weight: bold;
    }

    .box:hover {
      background-color: #ffafc0;
    }

    .reveal {
      display: none;
      animation: fadeIn 1s ease-in-out forwards;
    }

    .reveal p {
      font-size: 1.3em;
      color: #000;
      margin-bottom: 20px;
    }

    .reveal img {
      max-width: 400px;
      width: 100%;
      border-radius: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box" onclick="revealSurprise()">🎁</div>

    <div class="reveal" id="surprise">
      <p>Eu estarei aqui, para sempre! Meu segredo ❤️‍🔥</p>
      <img src="https://i.ibb.co/1GG7wtFZ/IMG-1441.jpg" alt="Surpresa romântica" />
    </div>
  </div>

  <script>
    function revealSurprise() {
      document.querySelector('.box').style.display = 'none';
      document.getElementById('surprise').style.display = 'block';
    }
  </script>

</body>
</html>
